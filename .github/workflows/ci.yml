name: CI

on:
  push:
    branches: [main, master, work/*]
  pull_request:

jobs:
  api-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install ruff
      - run: cd olenevod/apps/api && ruff check olenevod tests

  api-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: cd olenevod/apps/api && pip install -r requirements.txt mypy
      - run: cd olenevod/apps/api && mypy --strict olenevod/application olenevod/domain olenevod/infrastructure

  api-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: olenevod_test
          POSTGRES_USER: olenevod
          POSTGRES_PASSWORD: olenevod_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U olenevod -d olenevod_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: cd olenevod/apps/api && pip install -r requirements.txt pytest pytest-asyncio httpx
      - run: cd olenevod/apps/api && python -m alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://olenevod:olenevod_dev@localhost:5432/olenevod_test
      - run: cd olenevod/apps/api && DATABASE_URL=postgresql+psycopg://olenevod:olenevod_dev@localhost:5432/olenevod_test REDIS_URL=redis://localhost:6379/0 APP_MODE=demo python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: olenevod/apps/web/package-lock.json
      - run: cd olenevod/apps/web && npm ci
      - run: cd olenevod/apps/web && npm run lint
      - run: cd olenevod/apps/web && npm run typecheck
      - run: cd olenevod/apps/web && npm run build

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: olenevod/apps/admin/package-lock.json
      - run: cd olenevod/apps/admin && npm ci
      - run: cd olenevod/apps/admin && npm run lint
      - run: cd olenevod/apps/admin && npm run typecheck
      - run: cd olenevod/apps/admin && npm run build

  bots:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: olenevod_test
          POSTGRES_USER: olenevod
          POSTGRES_PASSWORD: olenevod_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U olenevod -d olenevod_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: cd olenevod/apps/api && pip install -r requirements.txt
      - run: cd olenevod/apps/api && python -m alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://olenevod:olenevod_dev@localhost:5432/olenevod_test
      - run: cd olenevod/apps/bots && pip install -r ../api/requirements.txt && pip install -e ../api && pip install -e . pytest pytest-asyncio
      - run: cd olenevod/apps/bots && ruff check .
      - run: cd olenevod/apps/bots && python -m pytest -q
        env:
          SECRET_KEY: test-secret
          DATABASE_URL: postgresql+asyncpg://olenevod:olenevod_dev@localhost:5432/olenevod_test
          REDIS_URL: redis://localhost:6379/0
          APP_MODE: demo