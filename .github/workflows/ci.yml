name: CI

on:
  push:
    branches: [main, master, work/*]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install ruff
      - run: cd olenevod/apps/api && ruff check olenevod tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install mypy pydantic pydantic-settings
      - run: cd olenevod/apps/api && mypy --strict olenevod/application olenevod/domain

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: olenevod_test
          POSTGRES_USER: olenevod
          POSTGRES_PASSWORD: olenevod_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U olenevod -d olenevod_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: cd olenevod/apps/api && pip install -r requirements.txt pytest pytest-asyncio httpx
      - run: cd olenevod/apps/api && DATABASE_URL=postgresql+psycopg://olenevod:olenevod_dev@localhost:5432/olenevod_test REDIS_URL=redis://localhost:6379/0 APP_MODE=demo pytest -q
