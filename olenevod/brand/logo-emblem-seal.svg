  <path id="seal-arc" fill="none" d="M 31 16 A 56 56 0 1 1 89 16"/>
  <text text-anchor="middle" startOffset="50%" method="align" spacing="auto" letter-spacing="3" font-family="sans-serif" font-weight="700" font-size="13" fill="#B33A20">
    <textPath href="#seal-arc">ОЛЕНЕВОД • ВОРКУТА •</textPath>
  </text>
