<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="Печать Оленевод">
  <desc>Знак внутри печати: текст по кругу «ОЛЕНЕВОД • ВОРКУТА •», в центре эмблема, глиф звезды над лбом.</desc>
